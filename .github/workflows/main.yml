    name: Publish NuGet Package

    on:
      push:
        branches:
          - pack # Or your desired branch for triggering the publish

    jobs:
      publish:
        runs-on: ubuntu-latest

        permissions:
            id-token: write

        steps:
          - name: Checkout code
            uses: actions/checkout@v3

          - name: Setup .NET
            uses: actions/setup-dotnet@v3
            with:
              dotnet-version: '10.0' # Specify your .NET version

          - name: Restore dependencies
            run: dotnet restore

          - name: Build the project
            run: dotnet build --configuration Release --no-restore

          - name: NuGet login (OIDC → temp API key)
            uses: NuGet/login@v1
            id: login
            with:
              user: ExoticGenius # Recommended: use a secret like ${{ secrets.NUGET_USER }} for your nuget.org username (profile name), NOT your email address
    

          - name: Pack the NuGet package
            run: |
                 dotnet pack EGO.Gladius/EGO.Gladius.csproj --configuration Release --no-build --output .
                 dotnet pack EGO.Gladius.Weaver/EGO.Gladius.Weaver.csproj --configuration Release --no-build --output .


          - name: Push to NuGet.org
            run: dotnet nuget push "*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
